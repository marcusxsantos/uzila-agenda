name: Deploy Agenda to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy na VPS
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo "🚀 Iniciando deploy de agenda.uzila.com.br..."

            # Carrega ambiente Node do NVM ou sistema
            export PATH=$PATH:/usr/bin:/usr/local/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            TARGET_DIR="/var/www/agenda.uzila.com.br"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Se ainda não for repositório git, clona o repo atual
            if [ ! -d ".git" ]; then
              echo "Clonando repositório..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "Atualizando código com git pull..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Injeta variáveis de ambiente de produção se configuradas no GitHub Secrets
            if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then
              echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
              echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
            fi

            echo "Instalando dependências..."
            npm install

            echo "Gerando build de produção..."
            npm run build

            # Permissões para o Nginx ler os arquivos
            chmod -R 755 "$TARGET_DIR/dist" 2>/dev/null || true
            chown -R www-data:www-data "$TARGET_DIR/dist" 2>/dev/null || true

            echo "✅ Deploy de agenda.uzila.com.br concluído com sucesso!"
