# ==============================================================================
# Configuração do Nginx para agenda.uzila.com.br
#
# Instruções de instalação na VPS:
# 1. Copie este arquivo para a VPS:
#    sudo cp nginx-agenda.uzila.com.br.conf /etc/nginx/sites-available/agenda.uzila.com.br
#
# 2. Ative o site criando o link simbólico:
#    sudo ln -s /etc/nginx/sites-available/agenda.uzila.com.br /etc/nginx/sites-enabled/
#
# 3. Teste e recarregue o Nginx:
#    sudo nginx -t && sudo systemctl reload nginx
#
# 4. Gere o certificado SSL gratuito via Let's Encrypt (Certbot):
#    sudo certbot --nginx -d agenda.uzila.com.br
# ==============================================================================

server {
    listen 80;
    server_name agenda.uzila.com.br;

    root /var/www/agenda.uzila.com.br/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/agenda.uzila.com.br.access.log;
    error_log /var/log/nginx/agenda.uzila.com.br.error.log;

    # Compressão Gzip para carregamento ultra rápido
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Roteamento SPA (Single Page Application)
    # Redireciona todas as rotas para o index.html gerado pelo Vite
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para assets estáticos com hash gerado pelo Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Headers de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
